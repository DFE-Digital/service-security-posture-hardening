# CROSS-TENANT ACCESS: the container. Carries allowedCloudEndpoints and the policy
# displayName and nothing per-partner. Thin on its own, and here because it states which
# clouds are in scope before the default and partner records below mean anything.
cross_tenant_access_policy = { endpoint = "/v1.0/policies/crossTenantAccessPolicy", permissions_required = [
  "Policy.Read.All",
] }

# THE TERMS ON WHICH WE TRUST EVERY EXTERNAL TENANT, unless a partner record below
# overrides them. `inboundTrust` is the part that matters: whether we accept another
# tenant's multi-factor, its compliant-device claim or its hybrid-joined-device claim IN
# PLACE OF OUR OWN. Accepting theirs means our own conditional access can be satisfied
# by a control we do not operate.
#
# Returns a SINGLE OBJECT rather than a collection. get_url handles both.
cross_tenant_access_policy_default = { endpoint = "/v1.0/policies/crossTenantAccessPolicy/default", permissions_required = [
  "Policy.Read.All",
] }

# PER-PARTNER OVERRIDES of the default above, one record per external tenant that has an
# explicit configuration.
#
# AN EMPTY COLLECTION IS A REAL ANSWER rather than a broken feed: it means no partner is
# configured individually, so the default record is what is in force everywhere. Now
# that a Graph error document is refused instead of indexed, no events and no logged
# error does mean "nothing configured".
#
# identitySynchronization IS EXPANDED because it is a trust term like the others: it says
# whether a partner may PROVISION USERS INTO our directory, which is a wider grant than
# anything in inboundTrust. It is a navigation property and is null unless expanded, so
# without this the feed would answer "on what terms do we trust them" with that term
# missing. A partner with no synchronisation configured expands to null, which is the
# answer rather than an absence.
#
# AND YES, $expand IS USED HERE while the app role assignment feed above deliberately
# avoids it. The hazard there is Graph CAPPING AN EXPANDED COLLECTION and truncating a
# member list silently. identitySynchronization is a SINGLE OBJECT per partner, and
# partners is itself a handful of records, so there is no member list that can be
# quietly cut short. Do not read this as licence to expand a collection.
cross_tenant_access_policy_partners = { endpoint = "/v1.0/policies/crossTenantAccessPolicy/partners?$expand=identitySynchronization", permissions_required = [
  "Policy.Read.All",
] }

