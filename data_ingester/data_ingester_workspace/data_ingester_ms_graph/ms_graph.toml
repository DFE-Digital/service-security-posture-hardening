# What must be satisfied before a directory role can be used: the approval, MFA,
# justification and authentication-context rules, and the maximum activation,
# assignment and eligibility durations. The roleAssignment/roleEligibility entries
# above say who holds a role; this says on what terms.
#
# The $filter is required by this endpoint rather than optional — without it the
# call fails. Microsoft's own documentation is inconsistent about the scopeType
# value: one example filters 'Directory' and one 'DirectoryRole', for the same
# tenant and the same role. The wrong value does not error, it returns an empty
# collection, so check the first run returns a record per directory role rather
# than nothing.
role_management_policy_assignments = { endpoint = "/v1.0/policies/roleManagementPolicyAssignments?$filter=scopeId eq '/' and scopeType eq 'DirectoryRole'&$expand=policy($expand=rules)", permissions_required = [
  "RoleManagementPolicy.Read.Directory",
] }

