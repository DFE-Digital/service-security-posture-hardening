# Resolves grantControls.authenticationStrength.id in a Conditional Access policy
# into what that strength actually demands: allowedCombinations lists the accepted
# method combinations, requirementsSatisfied says whether it counts as MFA, and
# policyType separates builtIn from custom. Returns both built-in and custom
# policies. Small: three built-ins plus whatever has been defined here.
authentication_strength_policies = { endpoint = "/v1.0/policies/authenticationStrengthPolicies", permissions_required = [
  "Policy.Read.AuthenticationMethod",
] }

