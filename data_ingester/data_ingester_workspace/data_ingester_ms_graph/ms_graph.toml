# Resolves the applications a Conditional Access policy includes or excludes.
#
# JOIN ON appId, NOT id. A CA policy names applications by their client id in
# conditions.applications.includeApplications and excludeApplications. On a
# servicePrincipal that is `appId`; `id` is the directory object id and will not
# match. The special values "All", "None", "Office365" and "MicrosoftAdminPortals"
# appear in place of a GUID and resolve to nothing here, by design.
#
# The $select is deliberate, not laziness. A full servicePrincipal carries
# appRoles and oauth2PermissionScopes, which for a large application runs to tens
# of thousands of characters. Splunk stops extracting JSON fields after
# [kv] maxchars, 10,240 by default, so an oversized record arrives whole and
# yields no fields at all — measured on the user feed as 23.8% of records. Extend
# this list once the feed is proven, a few properties at a time: one property
# Graph does not recognise fails the whole call with BadRequest.
#
# Deliberately not collected, ask if wanted: appRoles, oauth2PermissionScopes,
# keyCredentials, passwordCredentials, replyUrls, owners.
service_principals = { endpoint = "/v1.0/servicePrincipals?$select=id,appId,displayName,servicePrincipalType,accountEnabled,appOwnerOrganizationId,signInAudience,appRoleAssignmentRequired,publisherName,tags", permissions_required = [
  "Application.Read.All",
] }

# This tenant's own app registrations. An application is the definition; the
# servicePrincipal above is its instance in a tenant. A CA policy references the
# servicePrincipal side, so this is for questions about what we have registered
# rather than for resolving policy references.
#
# Same $select discipline as above. Deliberately not collected, ask if wanted:
# requiredResourceAccess, api, web, keyCredentials, passwordCredentials, owners.
applications = { endpoint = "/v1.0/applications?$select=id,appId,displayName,signInAudience,createdDateTime,publisherDomain,identifierUris,tags", permissions_required = [
  "Application.Read.All",
] }

# WHO HOLDS MICROSOFT GRAPH APPLICATION PERMISSIONS.
#
# Read from the RESOURCE side, not the holder side. An application's own permissions sit
# on /servicePrincipals/{id}/appRoleAssignments, which is one call per principal and
# about 14,000 of them. `appRoleAssignedTo` on the API's own service principal is the
# same data from the other end: every principal granted an app role ON Microsoft Graph,
# in one paged collection.
#
# NOT `$expand=appRoleAssignments` ON THE /servicePrincipals COLLECTION. Graph caps
# expanded collections and truncates silently - that is why
# `get_transitive_members_of_for_service_principals` exists even though the collection
# call already expands transitiveMemberOf. A principal with many permissions would come
# back looking LESS privileged than it is, which is the one failure a feed used to build
# a privileged population cannot tolerate.
#
# ALTERNATE KEY ADDRESSING. servicePrincipals(appId='...') selects by client id, because
# the object id of Graph's service principal differs per tenant while the appId
# 00000003-0000-0000-c000-000000000000 is the same in every tenant.
#
# ONE ENTRY PER RESOURCE API. This covers Microsoft Graph. Exchange Online, SharePoint
# and the rest would each need another entry of the same shape; Graph is the one that
# conveys directory privilege.
#
# EVENTUALLY CONSISTENT. Microsoft documents replication delays on this relationship for
# assignments granted or removed recently, so a permission granted today may not appear
# until a later run. Treat a principal's absence as "not seen yet" rather than "holds
# nothing" - the same distinction the transitiveMemberOf code makes for an unset value.
graph_app_role_assignments = { endpoint = "/v1.0/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo", source = "msgraph:graph_app_role_assignment", sourcetype = "m365:graph_app_role_assignment", permissions_required = [
  "Application.Read.All",
] }

# WHAT EACH PERMISSION GUID MEANS. An appRoleAssignment names its permission by
# `appRoleId` alone, so without this feed the assignments above are unreadable GUIDs.
#
# EXPLODED, and this is the only feed that is. Graph's `appRoles` is a single array of
# several hundred role definitions in ONE record, far past Splunk's [kv] maxchars of
# 10,240 - and an oversized record yields NO extracted fields at all, measured on the
# user feed at 23.8% of records. That is exactly why appRoles is excluded from the
# service_principals $select above. One event per role keeps every event extractable.
#
# SELF-MAINTAINING. Microsoft adds Graph permissions regularly; this reads the current
# set on every run rather than freezing a copy that then rots.
graph_app_roles = { endpoint = "/v1.0/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')?$select=id,appId,displayName,appRoles", explode = "appRoles", source = "msgraph:graph_app_role", sourcetype = "m365:graph_app_role", permissions_required = [
  "Application.Read.All",
] }

# WHICH DOMAINS THIS TENANT TRUSTS TO AUTHENTICATE. `authenticationType` is Managed or
# Federated, and a domain flipping from Managed to Federated hands whoever holds the
# federation signing material the ability to mint assertions for any account in it.
# Measured 2026-10-28: 4 domains, all Managed, the whole response 140 characters.
domains = { endpoint = "/v1.0/domains?$select=id,authenticationType,isVerified,isDefault,isInitial", source = "msgraph:domain", sourcetype = "m365:graph_domain", permissions_required = [
  "Domain.Read.All",
] }

# OWNERSHIP IS PRIVILEGE, and it appears in no role and no group membership. An owner of
# an application or service principal can add credentials to it; an owner of a group can
# add themselves to it, and if the group conveys a role they have taken that role.
#
# THREE DOCUMENTED LIMITS APPLY TO `$expand` ON A DIRECTORY RELATIONSHIP, and every one
# of them fails quietly. Microsoft's known-issues list states that it "Returns a maximum
# of 20 objects", that there is "No support for `@odata.nextLink`", and that there is "No
# support for nesting other query parameters such as `$filter` and `$select` inside an
# `$expand` query" - and the same list ends "Query parameters specified in a request
# might fail silently. This can be true for unsupported query parameters and for
# unsupported combinations of query parameters." So the overflow cannot be paged, nothing
# in a response says a list was cut, and the nested $select below is relied on but not
# guaranteed. The three mitigations are named against the three limits:
#
# 1. THE NESTED $select KEEPS THE RECORDS SMALL. Without it Graph returns a FULL user
#    object per owner, about 2,850 characters each, and a group with twelve owners is one
#    34,817 character record. Splunk's [kv] maxchars is 10,240 and an oversized record
#    yields NO extracted fields at all, so 27 of 100 groups sampled would have arrived
#    unreadable. Measured 2026-10-28 with it: max 2,725 for groups, 1,226 for
#    applications, 570 for service principals, nothing over the limit.
#
# 2. `explode` MAKES THAT SAFE RATHER THAN LUCKY, because limit three says the $select
#    may stop being honoured without saying so. One event per owner means the largest
#    possible event is a single owner - about 2,850 characters even as a full user object
#    - so the feed stays readable either way. The $select stays because it cuts the bytes
#    on the wire twelvefold; `explode` is here so that losing it is a cost, not an outage.
#
# 3. `refetch_at_cap` MAKES THE 20 CAP SURVIVABLE. A relationship's own endpoint is an
#    ordinary paged collection with no cap, so an object whose expanded list arrives at
#    20 is re-read there in full. It selects the same fields as the expand so a completed
#    list has the same shape as an uncapped one. It costs one request per such object and
#    nothing otherwise: measured 2026-10-28 the most owners on any object was 12, mean
#    2.5, none at the cap, so today it makes no requests at all. A refetch that fails
#    marks the record `owners_incomplete`, which rides onto every exploded event, because
#    a short list nothing flags is the whole failure being avoided here.
#
# THE GROUP REFETCH IS /beta AND MUST STAY THAT WAY. Microsoft's own note on
# group-list-owners says "Currently, service principals are not listed as group owners
# due to the staged rollout of service principals to the Microsoft Graph v1.0 endpoint",
# and v1.0 documents its response as a collection of USER objects. Measured against this
# tenant on 2026-10-28, on all six of the one hundred groups sampled that have a service
# principal owner: $expand returned the service principal, /v1.0/groups/{id}/owners
# returned ONLY the users, and /beta/groups/{id}/owners matched $expand exactly. So
# re-reading a capped group on v1.0 would DELETE every service principal owner and mark
# the result complete - strictly worse than not re-reading it, and silent. A service
# principal owning a role-assignable group is precisely the ownership path this feed
# exists to see.
#
# The /v1.0 OData casts - owners/microsoft.graph.user and owners/microsoft.graph.
# servicePrincipal - were tested too and do return both types, but they cost two requests
# and drop @odata.type, which the expand and /beta both carry and which is the only thing
# telling a user owner from a service principal owner. Applications and service
# principals have no such defect: measured on the same day, /v1.0 returned their service
# principal owners correctly, so those two stay on v1.0.
#
# THE EVENT SHAPE THESE THREE PRODUCE is one event per owner: the owner's own `id`,
# `userPrincipalName` and `displayName`, and the object they own under `parent_id` and
# `parent_displayName` - the owner wins the colliding keys because the owner is the
# subject of the event. Read `parent_id` for "who owns this", `id` for "what do they
# own". The sourcetype says which kind of object the parent is.
application_owners = { endpoint = "/v1.0/applications?$select=id,displayName,appId&$expand=owners($select=id,userPrincipalName,displayName)", explode = "owners", refetch_at_cap = "/v1.0/applications/{id}/owners?$select=id,userPrincipalName,displayName", source = "msgraph:application_owner", sourcetype = "m365:graph_application_owner", permissions_required = [
  "Application.Read.All",
  "Directory.Read.All",
] }

service_principal_owners = { endpoint = "/v1.0/servicePrincipals?$select=id,displayName,appId&$expand=owners($select=id,userPrincipalName,displayName)", explode = "owners", refetch_at_cap = "/v1.0/servicePrincipals/{id}/owners?$select=id,userPrincipalName,displayName", source = "msgraph:service_principal_owner", sourcetype = "m365:graph_service_principal_owner", permissions_required = [
  "Application.Read.All",
  "Directory.Read.All",
] }

group_owners = { endpoint = "/v1.0/groups?$select=id,displayName&$expand=owners($select=id,userPrincipalName,displayName)", explode = "owners", refetch_at_cap = "/beta/groups/{id}/owners?$select=id,userPrincipalName,displayName", source = "msgraph:group_owner", sourcetype = "m365:graph_group_owner", permissions_required = [
  "Group.Read.All",
  "Directory.Read.All",
] }

# SOFT DELETE OR HARD DELETE. A deleted directory object sits in a 30-day recycle bin
# and can be restored; a hard delete removes it immediately and cannot be undone. The
# audit log records both as a deletion, so only the recycle bin distinguishes them, and
# the difference matters because one is reversible and the other is destruction.
#
# The collection is TYPED, so each object type is its own endpoint rather than one call.
# Measured 2026-10-28: users 32 records at max 421 characters, applications 9 at 2,458,
# service principals 100+ at 2,525. Groups and devices returned zero, which is itself a
# finding - 541 group deletions in 90 days by 185 people against 979 hard deletes, so
# groups here are being destroyed rather than recycled.
deleted_items_users = { endpoint = "/v1.0/directory/deletedItems/microsoft.graph.user", source = "msgraph:deleted_item_user", sourcetype = "m365:graph_deleted_item_user", permissions_required = [
  "Directory.Read.All",
] }

deleted_items_groups = { endpoint = "/v1.0/directory/deletedItems/microsoft.graph.group", source = "msgraph:deleted_item_group", sourcetype = "m365:graph_deleted_item_group", permissions_required = [
  "Directory.Read.All",
] }

deleted_items_applications = { endpoint = "/v1.0/directory/deletedItems/microsoft.graph.application", source = "msgraph:deleted_item_application", sourcetype = "m365:graph_deleted_item_application", permissions_required = [
  "Application.Read.All",
] }

deleted_items_service_principals = { endpoint = "/v1.0/directory/deletedItems/microsoft.graph.servicePrincipal", source = "msgraph:deleted_item_service_principal", sourcetype = "m365:graph_deleted_item_service_principal", permissions_required = [
  "Application.Read.All",
] }

# Entra ID Protection: who is currently flagged as risky. A current-state list, one
# record per risky user with riskLevel, riskState, riskDetail and
# riskLastUpdatedDateTime, so a daily snapshot is the right shape for it.
#
# $top=500 is the documented maximum page size. Added 2026-10-02 after the first run
# returned a TooManyRequests error document alongside its 821 records: without $top
# the feed pages at the Graph default, and risk_detections, which already had $top,
# was not throttled in the same run. The reference states no default page size for
# this endpoint, so the number of requests saved is not known, only that 821 records
# now take two.
#
# Needs Entra ID P1 or P2. IdentityRiskyUser.Read.All is the only application
# permission for this endpoint; there is no higher-privileged alternative.
risky_users = { endpoint = "/v1.0/identityProtection/riskyUsers?$top=500", permissions_required = [
  "IdentityRiskyUser.Read.All",
] }

# Entra ID Protection: the individual risk detections. $top=500 because the default
# page size is 20 and 500 is the documented maximum.
#
# READ THIS BEFORE BUILDING ON IT. Unlike everything else in this file, these are
# events rather than state, and the collector has no notion of "since the last run".
# Every run re-fetches the whole retained set, so the same detection arrives once per
# run and the volume in Splunk grows as runs x retained detections, not as detections.
# Deduplicate on `id` in any search. The endpoint does support $filter on
# detectedDateTime, which would fix this properly, but a toml endpoint is a static
# string and cannot carry a moving date — that needs collector support.
#
# Measure the volume on the first run before anything depends on it: if the retained
# set is large, the duplication is the thing to deal with first.
#
# Needs Entra ID P1 or P2. IdentityRiskEvent.Read.All is the only application
# permission for this endpoint; there is no higher-privileged alternative.
risk_detections = { endpoint = "/v1.0/identityProtection/riskDetections?$top=500", permissions_required = [
  "IdentityRiskEvent.Read.All",
] }

