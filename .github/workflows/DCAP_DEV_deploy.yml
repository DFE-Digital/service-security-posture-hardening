---
name: DCAP _DEV Deploy

on:
  workflow_dispatch:

env:
  RUST_VERSION: "nightly"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          repository: DFE-Digital/ssphp-splunkcloud-app-packager
          ssh-key: ${{ secrets.SPLUNK_PACKAGER_GITHUB_DEPLOY_KEY }}

      - name: toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ${{ github.workspace }}/target
          key: cargo_build_cache-rust-target-${{ steps.toolchain.outputs.name}}-${{ hashFiles('Cargo.lock') }}

      - name: cargo build
        run: cargo build --release

      - name: SHA256 for release binary
        run: sha256sum target/release/splunkcloud-app-packager

      - name: Upload bin
        uses: actions/upload-artifact@v7
        with:
          name: splunkcloud-app-packager_${{ github.sha }}
          path: target/release/splunkcloud-app-packager
          if-no-files-found: error
          compression-level: 9


  deploy:
    needs: [build]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: splunkcloud-app-packager_${{ github.sha }}
          # path: splunkcloud-app-packager

      - name: Set binary to +x
        run: chmod +x splunkcloud-app-packager

      - name: SHA256 for release binary
        run: sha256sum splunkcloud-app-packager

      - name: Run Packager
        env:
          RUST_LOG: info
          SPLUNK_USER: ${{ secrets.SPLUNK_USERNAME }}
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
          SPLUNK_ACS_TOKEN: ${{ secrets.SPLUNK_ACS_TOKEN }}
          SPLUNK_ACS_STACK: ${{ secrets.SPLUNK_ACS_STACK }}
          # ONE ad-hoc cluster member by host id, installed with scope=local. The only ACS form
          # that installs since 2026-09-30 (Splunk SR 701521955); the stack-wide form fails with
          # "Failed to decrypt the token or your token has expired". DCAP is wanted on the ad-hoc
          # cluster only, and the stack token was minted there. If a deploy fails with 400
          # "invalid search head or search head cluster", autoscaling has replaced the member:
          # run `| rest splunk_server=local /services/server/info` on dfe.splunkcloud.com and
          # update the secret with the new serverName id.
          SPLUNK_ACS_TARGET: ${{ secrets.SPLUNK_ACS_TARGET }}
        run: ./splunkcloud-app-packager install-app -a DCAP #--environment prod