---
name: DCAP Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - DCAP/**
  workflow_dispatch:

concurrency: deploy-dcap

env:
  RUST_VERSION: "nightly"

jobs:
  build:
    name: Build DCAP Packager
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Packager Repo
        uses: actions/checkout@v7
        with:
          repository: DFE-Digital/ssphp-splunkcloud-app-packager
          ssh-key: ${{ secrets.SPLUNK_PACKAGER_GITHUB_DEPLOY_KEY }}

      - name: Set Rust Toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ${{ github.workspace }}/target
          key: cargo_build_cache-rust-target-${{ steps.toolchain.outputs.name}}-${{ hashFiles('Cargo.lock') }}

      - name: Run Cargo Build
        run: cargo build --release

      - name: Move File
        run: mv target/release/splunkcloud-app-packager .

      - name: Compute SHA256 for Release Binary
        run: sha256sum splunkcloud-app-packager > sha256.txt

      - name: Upload Binary and Hash
        uses: actions/upload-artifact@v7
        with:
          name: splunkcloud-app-packager_${{ github.sha }}
          path: |
            splunkcloud-app-packager
            sha256.txt
          if-no-files-found: error
          compression-level: 9

  deploy:
    name: Deploy DCAP to SplunkCloud
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: splunkcloud-app-packager_${{ github.sha }}
          path: ./artifact

      - name: Verify Binary Integrity
        run: |
          cd artifact
          sha256sum -c sha256.txt

      - name: Set Binary Executable
        run: chmod +x artifact/splunkcloud-app-packager

      - name: Compute SHA256 Again (Optional)
        run: sha256sum artifact/splunkcloud-app-packager

      - name: Run Packager
        env:
          RUST_LOG: info
          SPLUNK_USER: ${{ secrets.SPLUNK_USERNAME }}
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
          SPLUNK_ACS_TOKEN: ${{ secrets.SPLUNK_ACS_TOKEN }}
          SPLUNK_ACS_STACK: ${{ secrets.SPLUNK_ACS_STACK }}
          # ONE ad-hoc cluster member by host id, installed with scope=local. The only ACS form
          # that installs since 2026-09-30 (Splunk SR 701521955); the stack-wide form fails with
          # "Failed to decrypt the token or your token has expired". DCAP is wanted on the ad-hoc
          # cluster only, and the stack token was minted there. If a deploy fails with 400
          # "invalid search head or search head cluster", autoscaling has replaced the member:
          # run `| rest splunk_server=local /services/server/info` on dfe.splunkcloud.com and
          # update the secret with the new serverName id.
          SPLUNK_ACS_TARGET: ${{ secrets.SPLUNK_ACS_TARGET }}
        run: ./artifact/splunkcloud-app-packager install-app -a DCAP --environment prod