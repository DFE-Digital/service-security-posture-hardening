[ssphp_use_case_m365_cis_secure_score{{environment}}(1)]
definition = """
search `ssphp_metrics_data_index{{environment}}` sourcetype="ssphp:ms_graph:json" source="/v1.0/security/secureScores"
    [| search `ssphp_metrics_data_index{{environment}}` sourcetype="ssphp:ms_graph:json" source="/v1.0/security/secureScores"
    | stats max(SSPHP_RUN) as SSPHP_RUN
    | return SSPHP_RUN]

```### Each run returns 90 days of snapshots, one event per day. Take the newest.           ###```
```### createdDateTime is read with spath, not the auto-extractions: a snapshot holds every ###```
```### control, so the event can exceed the 10,240-character [kv] maxchars limit and yield  ###```
```### no extracted fields at all.                                                          ###```
| spath path=createdDateTime output=ssphp_created
| sort 0 - ssphp_created
| head 1

```### One event holds every control, so the array must be expanded before controlName can  ###```
```### be filtered. Reading controlScores{}.controlName directly would match a value from   ###```
```### any control in the snapshot.                                                         ###```
| spath path=controlScores{} output=ssphp_control
| mvexpand ssphp_control
| spath input=ssphp_control
| search controlName="$target_field$"

```### remove html tags ###```
| rex mode=sed field=description "s/(<.*?>)//g"
| eval description=replace(description,"&nbsp;"," ")

| fields SSPHP_RUN, controlName, controlCategory, count, description, implementationStatus, score, total, on, state, lastSynced

"""

args = target_field
iseval = 0
